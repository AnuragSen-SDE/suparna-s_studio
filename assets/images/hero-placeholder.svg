<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="40%" stop-color="#F5E6E0"/>
      <stop offset="70%" stop-color="#E8C4C4"/>
      <stop offset="100%" stop-color="#D4A5A5"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="20%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#B76E79" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#B76E79" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <rect width="1920" height="1080" fill="url(#glow2)"/>
  <!-- Decorative circles -->
  <circle cx="1600" cy="200" r="120" fill="none" stroke="#B76E79" stroke-width="1" opacity="0.2"/>
  <circle cx="1600" cy="200" r="80" fill="none" stroke="#B76E79" stroke-width="0.5" opacity="0.15"/>
  <circle cx="300" cy="850" r="100" fill="none" stroke="#B76E79" stroke-width="1" opacity="0.15"/>
  <!-- Subtle floral motif -->
  <g opacity="0.08" fill="#B76E79">
    <ellipse cx="960" cy="540" rx="200" ry="80" transform="rotate(-15 960 540)"/>
    <ellipse cx="960" cy="540" rx="200" ry="80" transform="rotate(15 960 540)"/>
    <ellipse cx="960" cy="540" rx="200" ry="80" transform="rotate(75 960 540)"/>
    <ellipse cx="960" cy="540" rx="200" ry="80" transform="rotate(-75 960 540)"/>
  </g>
  <text x="960" y="540" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#B76E79" opacity="0.25" letter-spacing="8">SUPARNA STUDIO</text>
</svg>
